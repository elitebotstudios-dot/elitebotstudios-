    <rect x="143" width="112" height="49" rx="5" fill="#121920" stroke="#40515B"/><text x="157" y="20" fill="#D8B66A" font-family="ui-monospace,monospace" font-size="9" letter-spacing="1">POWER</text><text x="157" y="36" fill="#9DAAB8" font-family="ui-monospace,monospace" font-size="9">switching stage</text>
    <rect x="286" width="112" height="49" rx="5" fill="#121920" stroke="#40515B"/><text x="300" y="20" fill="#59D9E8" font-family="ui-monospace,monospace" font-size="9" letter-spacing="1">CONTROL</text><text x="300" y="36" fill="#9DAAB8" font-family="ui-monospace,monospace" font-size="9">measure + decide</text>
