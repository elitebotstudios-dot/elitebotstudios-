<text class="note" x="34" y="632">The current path runs from the input terminals through the fuse, the reverse-protection diode and the shunt to the</text><text class="note" x="34" y="649">load. The sensor attaches across the shunt by the net labels VPROT and VLOAD: IN+ (pin 10) to the supply side, IN−</text><text class="note" x="34" y="666">(pin 9) and VBUS (pin 8) to the load side.</text>
