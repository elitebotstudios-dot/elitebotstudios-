<svg xmlns="http://www.w3.org/2000/svg" class="system-art" viewBox="0 0 980 620" role="img" aria-labelledby="systemArtTitle systemArtDesc">
  <title id="systemArtTitle">Conceptual embedded power-control system</title>
  <desc id="systemArtDesc">An original illustrative circuit-board composition linking a DC source, power-conversion stage, embedded controller, and measurement feedback. It is a conceptual diagram, not a fabricated board.</desc>
  <defs>
    <pattern id="fineGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#D8B66A" stroke-opacity=".055" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.1" fill="#59D9E8" fill-opacity=".18"/>
    </pattern>
    <linearGradient id="boardFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2733"/><stop offset="1" stop-color="#0C1219"/>
    </linearGradient>
    <linearGradient id="boardEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#263441"/><stop offset="1" stop-color="#0A0E13"/>
    </linearGradient>
    <linearGradient id="goldTrace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7A6237"/><stop offset=".52" stop-color="#D8B66A"/><stop offset="1" stop-color="#947840"/>
    </linearGradient>
    <linearGradient id="cyanTrace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#236B77"/><stop offset=".55" stop-color="#59D9E8"/><stop offset="1" stop-color="#398B96"/>
    </linearGradient>
    <filter id="boardShadow" x="-.2" y="-.2" width="1.4" height="1.6">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/><feOffset dy="17"/><feComponentTransfer><feFuncA type="linear" slope=".52"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-.5" y="-.5" width="2" height="2"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="980" height="620" fill="#0B1016"/>
  <rect width="980" height="620" fill="url(#fineGrid)"/>
  <ellipse cx="506" cy="318" rx="370" ry="203" fill="#59D9E8" opacity=".025"/>
  <g fill="none" stroke="#52616D" stroke-opacity=".45" stroke-width="1">
    <path d="M44 76h136v24M800 66h128v48M52 535h170v-28M790 536h142v-35"/>
