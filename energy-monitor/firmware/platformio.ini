; PlatformIO project — Smart DC Energy Monitor, DCM-HW-V1 rev A
;
; Two environments:
;   native   builds and runs the calculation core and its tests on the host.
;            This is the only environment that has actually been built in the
;            authoring environment, using g++ directly (see README).
;   esp32dev builds the firmware for an ESP32-DevKitC-32E. NEVER BUILT in the
;            authoring environment: no ESP32 toolchain was available.
;
; Board and framework notes:
;   board = esp32dev      generic ESP32 development board definition
;   framework = arduino   Arduino-ESP32 core; the INA226 is driven over Wire
;                         directly, so no third-party sensor library is needed.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DDCM_TARGET_ESP32=1
build_src_filter = +<src/main.cpp> +<src/core/>
test_ignore = test_desktop

[env:native]
platform = native
build_flags = -std=c++17 -Iinclude
build_src_filter = +<src/core/>
test_filter = test_desktop
