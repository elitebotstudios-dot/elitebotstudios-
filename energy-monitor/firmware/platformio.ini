; PlatformIO project — Smart DC Energy Monitor, DCM-HW-V1 rev B
;
;   env:esp32dev  cross-compiles the full firmware for the ESP32-DevKitC-32E
;   env:native    builds the portable core only, for host testing
;
; build_src_filter paths are relative to src_dir, so they name main.cpp and
; core/ directly rather than src/main.cpp.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<main.cpp> +<core/>
build_flags =
    -DDCM_TARGET_ESP32=1
    -Wall
    -Wextra
build_unflags = -std=gnu++11
build_flags_extra = -std=gnu++17
test_ignore = *

[env:native]
platform = native
build_src_filter = +<core/>
build_flags = -std=c++17 -Iinclude -Wall -Wextra
test_ignore = *
